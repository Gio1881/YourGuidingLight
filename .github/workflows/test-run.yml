  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: npm install

  - name: Start dev server and fetch site
    run: |
      npm run start > server.log 2>&1 &
      # wait up to 30 seconds for the server to start
      for i in {1..30}; do
        if curl -sSf http://localhost:8000/ -o /dev/null; then
          echo "server is up"
          break
        fi
        echo "waiting for server... ($i)"
        sleep 1
      done
      if ! curl -sSf http://localhost:8000/ -o site_index.html; then
        echo "server failed to respond; dumping server.log"
        cat server.log || true
        node -v
        npm -v
        exit 1
      fi
      echo "--- site index ---"
      cat site_index.html
    shell: bash

  - name: Upload site index
    uses: actions/upload-artifact@v4
    with:
      name: site-index
      path: site_index.html
